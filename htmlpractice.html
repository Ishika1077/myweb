<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
 :root {
      --cream: #F3EFE8;
      --olive: #303D35;
      --sage: #657C69;
      --terracotta: #B97559;
      --teal: #78938A;
      --white: #FFFFFF;
      --text: #454A43;
    }


body{
  background: var(--cream);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
}

 h1, h2, h3 {
      font-family: 'Playfair Display', serif;
      color: var(--cream);
    }






/* ================= SECTION ================= */

.section{
    width:90%;
    margin:auto;
    margin-top:70px;
    margin-bottom:60px;
}

.section h2{
    text-align:center;
    color:var(--terracotta);
    font-size:36px;
    margin-bottom:40px;
}

/* ================= CARD GRID ================= */

.grid{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap:28px;
}

/* ================= CARD ================= */

.card{
    background:white;
    border-radius:18px;
    overflow:hidden;
    text-decoration:none;
    color:#222;
    box-shadow:0 12px 28px rgba(0,0,0,0.12);
    transition:0.35s;
}

.card:hover{
    transform:translateY(-12px);
    box-shadow:0 20px 40px rgba(0,0,0,0.2);
}


.pic
{
    width: 250px;
}
/* ================= THUMB ================= */

.thumb{
    height:150px;
    background: var(--teal);
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:28px;
    font-weight:700;
}

/* ================= CARD TEXT ================= */

.card p{
    padding:18px;
    text-align:center;
    font-weight:600;
    font-size:16px;
    color: var(--text);
}





/* ================= MOBILE ================= */

@media(max-width:600px){

.hero h1{
    font-size:38px;
}

.navbar{
    flex-wrap:wrap;
    gap:10px;
}

.section h2{
    font-size:28px;
}

}

</style>
</head>
