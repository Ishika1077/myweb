<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Working with Do While</h1>
    <div style="width: 60%;margin:auto">
        <script>
            //do while id Post Tested loop

            var t = 1
            do
            {

                document.write("<input style='height:30px;border:2px;' type='text' value='&nbsp;'>")
                t++
            }while(t<=100)
        </script>
    </div>
</body>
</html>
