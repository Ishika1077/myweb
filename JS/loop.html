<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    .main
    {
        width: 30%;
        height:40px;
        border-radius: 30px;
        text-align: center;
        margin: auto;
        margin-top: 30px;
        background-color:rgb(26, 11, 1);
        color:rgb(255, 163, 97) ;
    }

    .pic{
        width:25%;
        cursor:pointer;
        box-shadow: 5px 5px 20px rgb(255, 200, 98);
        margin: 40px;
        transition:0.50s;
        border-radius: 5%;
    }

    body{
        text-align: center;
        background-color: rgb(154, 67, 5);
    }
</style>
<body>
    
    <div class="main">
        <h2>Halloween Theme</h2>
    </div>
    <script>
        for ( var  i=1; i<=9;i++)
    {
        document.write("<img onmouseout= 'zoomout(this)' onclick='zoom(this)' class='pic' src='Pic/p"+i+".jpg'>")
    }

    function zoom(t)
    {
      t.style.transform="scale(2)"
    }

    function zoomout(t)
    {
        t.style.transform="scale(1)"
    }

   
    </script>
</body>

</html>
