<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        margin:0px;
        padding:0px;
        background: url(Pic/pencil123.jpg),no-repeat center center/cover;
        text-align: center;
    }

    #main{
        text-align: center;
        color: aliceblue;
        font-family: Arial black;
        font-size: 22px;
        background: rgba(1, 13, 27,0.6) ;
        margin-top: 1px;
        padding: 10px;
    }
</style>
<body>
  <button style="margin-top: 20px;"onclick="createtable()">Click To Create a Table</button>  

  <div id="main">
    <script>
        var data=""
        var d = document.getElementById("main")

        function createtable(){
            var n = prompt("Enter a Number to Create Table...","2")
            data="Table of "+n+"</br/>"

            for(var i = 1;i<=10;i=i+1)
        {
            data+= "<h4>"+n+" * "+1+" = "+n*i+"</h4>"
        }

        d.innerHTML = data
        }
    </script>
  </div>
</body>
</html>
