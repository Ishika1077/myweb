<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Age Calculator</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: "Arial", sans-serif;
        background-color: #042744;
        color: #e5e5e5;
        display: flex;
        justify-content: center;
    }

    .container {
        width: 100%;
        max-width: 420px;
        padding: 30px 20px;
    }

    h1 {
        text-align: center;
        font-size: 32px;
        font-weight: bold;
        color: white;
        margin-bottom: 30px;
    }

    label {
        font-size: 18px;
        margin-bottom: 10px;
        display: block;
    }

    .input-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 20px;
    }

    .input-box {
        width: 30%;
        height: 10px;
        background-color: rgba(255,255,255,0.08);
        padding: 18px 0;
        border-radius: 14px;
        text-align: center;
        font-size: 20px;
        color: #9fb3c8;
        border: 2px solid transparent;
        transition: 0.2s;
    }

    .input-box:focus {
        outline: none;
        border-color: #37d4ac;
        color: white;
    }

    .divider {
        height: 2px;
        width: 100%;
        background-color: rgba(255,255,255,0.1);
        margin: 25px 0;
    }

    button {
        width: 100%;
        height: 50px;
        padding: 12px 0;
        border: none;
        border-radius: 14px;
        background-color: #36d6b1;
        font-size: 22px;
        color: #123;
        font-weight: bold;
        cursor: pointer;
        margin-bottom: 25px;
        transition: 0.2s;
    }

    button:hover {
        opacity: 0.85;
    }

    .result-box {
        background-color: rgba(0,0,0,0.25);
        border-color: #38e3bf;
        padding: 45px 0;
        border-radius: 18px;
        text-align: center;
        box-shadow: 0 10px 25px rgba(91, 179, 191, 0.874);
    }

    .result-age {
        font-size: 90px;
        color: #38e3bf;
        margin: 0;
    }

    .result-details {
        margin-top: 15px;
        font-size: 22px;
        color: #c7d6e5;
    }
</style>
</head>

<body>
<div class="container">

    <h1>Age Calculator</h1>

    <label>Enter your date of birth</label>

    <div class="input-row">
        <input type="number" id="day" class="input-box" placeholder="DD" min="1" max="31">
        <input type="number" id="month" class="input-box" placeholder="MM" min="1" max="12">
        <input type="number" id="year" class="input-box" placeholder="YYYY" min="1900" max="2100">
    </div>

    <div class="divider"></div>

    <button onclick="calculateAge()">Calculate Age</button>

    <div class="result-box">
        <p class="result-age" id="ageNum">--</p>
        <p class="result-details" id="ageDetails">Enter a date above</p>
    </div>

</div>

<script>
function calculateAge() {
    let d = document.getElementById("day").value;
    let m = document.getElementById("month").value;
    let y = document.getElementById("year").value;

    if (!d || !m || !y) {
        alert("Please fill out all fields.");
        return;
    }

    let dob = new Date(y, m - 1, d);
    let now = new Date();

    if (dob > now) {
        alert("Birth date cannot be in the future.");
        return;
    }

    let years = now.getFullYear() - dob.getFullYear();
    let months = now.getMonth() - dob.getMonth();
    let days = now.getDate() - dob.getDate();

    if (days < 0) {
        months--;
        days += new Date(now.getFullYear(), now.getMonth(), 0).getDate();
    }

    if (months < 0) {
        years--;
        months += 12;
    }

    document.getElementById("ageNum").innerText = years;
    document.getElementById("ageDetails").innerText =
        `${months} months, ${days} days\nThat's your age!`;
}
</script>

</body>
</html>
