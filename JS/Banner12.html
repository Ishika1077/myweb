<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>getElementById</title>
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
  />
</head>

<style>
    body{
        background-color: rgb(241, 222, 241);
    }

    h1{
        width: 40%;
        margin: auto;
        margin-top: 2%;
        margin-bottom: 2%;
        border-radius: 50%;
        text-align: center;
        font-size: xx-large;
        
    }
    #banner{
        width:70%;
        height:500px;
        margin:auto;
        box-shadow:5px 5px 5px lightsteelblue;
    }

    #pic{
        width:100%;
        height:100%;
    }
</style>
<body>
    <!---
    <h1>Creating Animated banner by GetElement() in Js</h1>

    -->
    <h1> Banner </h1>

    <div id="banner">
    
        <img id="pic" src="Pic/p1.jpg">
        <br/>
        <button onclick="next()"style="margin-left:5%">➡️</button>
        <button onclick="prev()"style="margin-left: 80%;">⬅️</button>


     <script>

      

        var p = document.getElementById("pic")
        var c = 1

        function changepic( )
        {
            p.src="Pic/p"+c+".jpg"

           p.classList.add("animate__animated","animate__fadeOut")

           setTimeout('p.classList.remove("animate__fadeOut")',500)


           document.title = c
           
        }

        function next()
        {
        if(c<6)
        {
            c++
        }
       changepic( )

        }


        function prev()
        {
            if(c>1)
        {
            c=c-1
        }

        changepic( )

         setTimeout('p.classList.remove("animate__fadeOut")',500)

        }

     </script>   
     </div>
     
</body>
</html>
