<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
   
#main{
    text-align: center;
    padding: 5%;
    color: rgb(11, 140, 176);
   font-family: arial black;
}
</style>

<body>
    <div id = "main">
    <h1>Working with Array</h1>
    <button onclick = "ch()">Change Background color</button>
   
    <script>

        var mycolor = ["beige","plum","skyblue","cyan","orange","pink"]
       // alert(mycolor)
       //document.title= mycolor[1]
      // document.bgColor = mycolor[2]
     // alert(mycolor.length)
     var c = 0
     function ch()
     {
        if(c<mycolor.length)
     {
        document.body.style.background = mycolor[c]
        c++
     }
     else
     {
        c=0
     }

     document.title = c
     }
    </script>
    </div>
</body>
