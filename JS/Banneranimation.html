<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>

    body
    {
        background-color: rgb(204, 226, 244);
    }

 h1{
        width: 40%;
        margin: auto;
        margin-top: 2%;
        margin-bottom: 2%;
        border-radius: 50%;
        text-align: center;
        font-size: xx-large;
        color: rgb(13, 78, 199);
        font-family: arial black;
        
    }

    #banner
    {
        width: 70%;
        height: 500px;
        margin: auto;
        box-shadow: 5px 5px 5px lightskyblue;
    }


    #pic
    {
        width: 100%;
        height: 100%;
    }

    input[type="radio"]
    {
        height: 20px;
        width: 20px;
        accent-color: rgb(11, 124, 162);
    }
</style>
<body>

    <h1>Disney Movies</h1>
  
    <div id="banner">

        <img id="pic" src="Pic/d1.jpg">

        <br/>
        <br/>
        <div style="text-align: center;">

            <input type="radio" name="my button"  id="b1">
            <input type="radio" name="my button"  id="b2">
            <input type="radio" name="my button"  id="b3">
            <input type="radio" name="my button"  id="b4">
            <input type="radio" name="my button"  id="b5">
            <input type="radio" name="my button"  id="b6">
            <input type="radio" name="my button"  id="b7">

            </div>

            <script>

             var p =   document.getElementById("pic")
             var c = 1
             b1 = document.getElementById("b1")
             b2 = document.getElementById("b2")
             b3 = document.getElementById("b3")
             b4 = document.getElementById("b4")
             b5 = document.getElementById("b5")
             b6 = document.getElementById("b6")
             b7 = document.getElementById("b7")



             b1.onclick = function()
             {
                p.src="Pic/d1.jpg"
                p.classList.add("animate__animated","animate__fadeOut")
                setTimeout('p.classList.remove("animate__fadeOut")',500)
             }



              b2.onclick = function()
             {
                p.src="Pic/d2.jpg"
                p.classList.add("animate__animated","animate__fadeOut")
                setTimeout('p.classList.remove("animate__fadeOut")',500)
             }



              b3.onclick = function()
             {
                p.src="Pic/d3.jpg"
                p.classList.add("animate__animated","animate__fadeOut")
                setTimeout('p.classList.remove("animate__fadeOut")',500)
             }



              b4.onclick = function()
             {
                p.src="Pic/d4.jpg"
                p.classList.add("animate__animated","animate__fadeOut")
                setTimeout('p.classList.remove("animate__fadeOut")',500)
             }



              b5.onclick = function()
             {
                p.src="Pic/d5.jpg"
                p.classList.add("animate__animated","animate__fadeOut")
                setTimeout('p.classList.remove("animate__fadeOut")',500)
             }



              b6.onclick = function()
             {
                p.src="Pic/d6.jpg"
                p.classList.add("animate__animated","animate__fadeOut")
                setTimeout('p.classList.remove("animate__fadeOut")',500)
             }



              b7.onclick = function()
             {
                p.src="Pic/d7.jpg"
                p.classList.add("animate__animated","animate__fadeOut")
                setTimeout('p.classList.remove("animate__fadeOut")',500)
             }

             function changepic()
             {
                if(c<7)
                {
                  c++
                }
                else
                {
                    c=1
                }

                if(c==1){b1.checked = true;}
                if(c==2){b2.checked = true;}
                if(c==3){b3.checked = true;}
                if(c==4){b4.checked = true;}
                if(c==5){b5.checked = true;}
                if(c==6){b6.checked = true;}
                if(c==7){b7.checked = true;}

                p.src="Pic/d"+c+".jpg"
                 p.classList.add("animate__animated","animate__fadeOut")
                setTimeout('p.classList.remove("animate__fadeOut")',500)


                document.title = c
                
                  }

                  setInterval("changepic()",5000)


               </script>

              </div>
              </body>
              </html>
