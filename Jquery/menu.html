
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>

<style>
    
    #main{
        background:rgb(9,1,1);
        width:150px;
        padding-top: 10px;
        box-shadow: 10px 10px 10px gray;
        display: none;
    }

    .m{
        margin:auto;
        list-style: none;
        padding: 0px;
        text-align: center;
        width:150px;
        transition: 2s;
    }

    .m li{
        margin-top: 1px;
        padding: 10px;
    }
    .m li:hover{
        transition:2s;
        background:#30aaa1;
        color:black;
    }
    .m a:link{
        text-decoration: none;
        color:white;

    }

    .m a:visited{
        text-decoration: none;
        color: white;
        text-align: left;
    }

   

</style>

<body>
    <script>
     $(document).ready(function()
    {
        $("#mymenu").click(function()
        {
        $("#main").slideToggle()
        });

        $("#product").click(function()
        {
            $("#productsub").slideToggle()
            $("#datasub").hide(1000)
        })

        $("#data").click(function()
        {
            $("#datasub").slideToggle()
            $("#productsub").slideUp(1000)
        })
    })

    </script>

    <button id="mymenu">Menu</button>

    <div id="main">
        <ol class="m">
            <li><a href ="index.html">Home</a></li>
            <li><a href="#">Product</a>
           <li><a href="#">Services</a></li>

            <li><a  href="#">Data</a>
            <li><a href="#">Photo Gallery</a></li>
            <li><a href="#">Contact</a></li>

        </ol>
    </div>
    
</body>
</html>
