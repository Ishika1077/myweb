<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Bootstrap Alert Practice</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <div class="container mt-5">
    <h2 class="mb-4">Bootstrap Alert Practice</h2>

    <div class="alert alert-success">
      This is a success alert — good job!
    </div>

  
    <div class="alert alert-info">
      This is an info alert — read carefully.
    </div>

  
    <div class="alert alert-warning">
      This is a warning alert — be careful!
    </div>

  
    <div class="alert alert-danger">
      This is a danger alert — something went wrong!
    </div>

   
   <div id="myAlert" class="alert alert-primary alert-dismissible " >
       This alert can be closed.
     <button type="button" class="btn-close" onclick="closeAlert()"></button>
    </div>

    <button class="btn btn-primary mb-3" onclick="openAlert()"> Open Alert </button>

    </div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<script>
    function openAlert() {
       document.getElementById("myAlert").className="d-block"

    }

    function closeAlert() {
        document.getElementById("myAlert").className="d-none"
    }
</script>
 

</body>
</html>
